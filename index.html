        // ==========================================
        // VISTA 1.5: VENTAS E INDICADORES
        // ==========================================
        function VistaVentas({ ventas, unidades, modelos, accesorios, esAdmin, callGAS, onUpdate }) {
            const [rango, setRango] = useState('mes');
            const margenRef = useRef(null);
            const ventasRef = useRef(null);
            const chartsRef = useRef({ margen: null, ventas: null });
            const [chartOk, setChartOk] = useState(typeof window !== 'undefined' && !!window.Chart);
            const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            const labelRango = rango === 'mes' ? 'Este mes' : rango === 'trim' ? 'Últimos 3 meses' : 'Este año';

            const bounds = useMemo(() => {
                const now = new Date();
                const inicioMes = new Date(now.getFullYear(), now.getMonth(), 1);
                const b = {
                    start: inicioMes,
                    end: new Date(now.getFullYear(), now.getMonth() + 1, 1),
                    prevStart: new Date(now.getFullYear(), now.getMonth() - 1, 1),
                    prevEnd: inicioMes,
                    bucket: 'dia'
                };
                if (rango === 'trim') {
                    b.start = new Date(now.getFullYear(), now.getMonth() - 2, 1);
                    b.end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                    b.prevStart = new Date(now.getFullYear(), now.getMonth() - 5, 1);
                    b.prevEnd = b.start;
                    b.bucket = 'sem';
                } else if (rango === 'anio') {
                    b.start = new Date(now.getFullYear(), 0, 1);
                    b.end = new Date(now.getFullYear() + 1, 0, 1);
                    b.prevStart = new Date(now.getFullYear() - 1, 0, 1);
                    b.prevEnd = b.start;
                    b.bucket = 'sem';
                }
                return b;
            }, [rango]);

            const dentro = (v, ini, fin) => {
                const d = v.fecha_hora ? new Date(v.fecha_hora) : null;
                return d && !isNaN(d.getTime()) && d >= ini && d < fin;
            };

            const nombreProducto = (v) => {
                if (String(v.tipo_producto) === 'celular') {
                    const un = unidades.find(u => u.imei && String(u.imei) === String(v.imei))
                        || unidades.find(u => String(u.id) === String(v.unidad_id));
                    if (un) {
                        const mo = modelos.find(m => String(m.id) === String(un.modelo_id));
                        if (mo) return mo.nombre;
                    }
                    return v.imei ? ('Celular · ' + v.imei) : 'Celular';
                }
                const acc = accesorios.find(a => String(a.id) === String(v.producto_id) || String(a.id) === String(v.unidad_id));
                return acc ? acc.nombre : (String(v.tipo_producto || 'Accesorio'));
            };

            const calcKpis = (list) => {
                const n = list.length;
                const valVenta = list.reduce((s, x) => s + (Number(x.valor_venta) || 0), 0);
                const costo = list.reduce((s, x) => s + (Number(x.costo_total) || 0), 0);
                const gan = list.reduce((s, x) => s + (Number(x.ganancia) || 0), 0);
                const porModelo = {};
                list.forEach(v => {
                    const k = nombreProducto(v);
                    porModelo[k] = (porModelo[k] || 0) + (Number(v.ganancia) || 0);
                });
                let mejor = { label: '—', valor: 0 };
                Object.keys(porModelo).forEach(k => { if (porModelo[k] > mejor.valor) mejor = { label: k, valor: porModelo[k] }; });
                return {
                    n, valVenta, costo, gan,
                    margen: valVenta > 0 ? (gan / valVenta) * 100 : 0,
                    ticket: n > 0 ? valVenta / n : 0,
                    costoProm: n > 0 ? costo / n : 0,
                    mejor: mejor,
                    porModelo: porModelo
                };
            };

            const ventasPer = useMemo(() => ventas.filter(v => dentro(v, bounds.start, bounds.end)), [ventas, bounds]);
            const ventasPrev = useMemo(() => ventas.filter(v => dentro(v, bounds.prevStart, bounds.prevEnd)), [ventas, bounds]);
            const kpis = useMemo(() => calcKpis(ventasPer), [ventasPer, unidades, modelos, accesorios]);
            const kpisPrev = useMemo(() => calcKpis(ventasPrev), [ventasPrev, unidades, modelos, accesorios]);

            const deltaAct = useMemo(() => {
                const pct = (cur, prev) => {
                    if (!prev) return null;
                    return ((cur - prev) / Math.abs(prev)) * 100;
                };
                const fmtD = (p, better) => {
                    if (p == null || !isFinite(p)) return null;
                    return { better: better ? p >= 0 : p <= 0, text: `${p >= 0 ? '+' : ''}${p.toFixed(1)}%` };
                };
                const mismo = kpis.mejor.label !== '—' && kpisPrev.porModelo[kpis.mejor.label] != null;
                return {
                    margen: fmtD(pct(kpis.margen, kpisPrev.margen), true),
                    gan: fmtD(pct(kpis.gan, kpisPrev.gan), true),
                    ticket: fmtD(pct(kpis.ticket, kpisPrev.ticket), true),
                    costo: fmtD(pct(kpis.costoProm, kpisPrev.costoProm), false),
                    mejor: mismo ? fmtD(pct(kpis.mejor.valor, kpisPrev.porModelo[kpis.mejor.label]), true) : null
                };
            }, [kpis, kpisPrev]);

            const serie = useMemo(() => {
                const puntos = [];
                const pasoDias = bounds.bucket === 'dia' ? 1 : 7;
                const cursor = new Date(bounds.start.getTime());
                while (cursor < bounds.end) {
                    const ini = new Date(cursor);
                    const fin = new Date(cursor);
                    fin.setDate(fin.getDate() + pasoDias);
                    const list = ventas.filter(v => dentro(v, ini, fin));
                    const val = list.reduce((s, x) => s + (Number(x.valor_venta) || 0), 0);
                    const gan = list.reduce((s, x) => s + (Number(x.ganancia) || 0), 0);
                    puntos.push({ label: `${ini.getDate()} ${MESES[ini.getMonth()]}`, ventas: val, margen: val > 0 ? (gan / val) * 100 : null });
                    cursor.setDate(cursor.getDate() + pasoDias);
                }
                return puntos;
            }, [ventas, bounds]);

            const sinDatos = ventasPer.length === 0;

            useEffect(() => {
                if (!window.Chart) { setChartOk(false); return; }
                setChartOk(true);
                if (sinDatos) return;

                const buildScales = (fmt) => ({
                    x: {
                        grid: { display: false },
                        border: { display: false },
                        ticks: { color: '#9a9a9a', font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: bounds.bucket === 'dia' ? 12 : 16 }
                    },
                    y: {
                        grid: { color: 'rgba(42,42,42,0.6)', drawTicks: false },
                        border: { display: false },
                        ticks: { color: '#9a9a9a', font: { size: 10 }, callback: (valv) => fmt(valv) }
                    }
                });

                const mkConfig = (datos, fmt) => ({
                    type: 'line',
                    data: {
                        labels: serie.map(s => s.label),
                        datasets: [{
                            data: datos,
                            borderColor: '#d4af37',
                            borderWidth: 2,
                            pointRadius: 0,
                            pointHoverRadius: 5,
                            pointHoverBackgroundColor: '#f4e5a1',
                            pointHoverBorderColor: '#f4e5a1',
                            fill: true,
                            backgroundColor: (ctx) => {
                                const { ctx: c, chartArea } = ctx.chart;
                                if (!chartArea) return 'rgba(212,175,55,0.15)';
                                const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                                g.addColorStop(0, 'rgba(212,175,55,0.35)');
                                g.addColorStop(0.55, 'rgba(212,175,55,0.12)');
                                g.addColorStop(1, 'rgba(212,175,55,0)');
                                return g;
                            },
                            tension: 0.35,
                            spanGaps: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 350 },
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#0d0d0d',
                                borderColor: '#d4af37',
                                borderWidth: 1,
                                titleColor: '#f4e5a1',
                                bodyColor: '#e6e6e6',
                                displayColors: false,
                                padding: 10,
                                cornerRadius: 8,
                                callbacks: { label: (c) => fmt(c.parsed.y) }
                            }
                        },
                        scales: buildScales(fmt)
                    }
                });

                if (margenRef.current) {
                    chartsRef.current.margen?.destroy();
                    chartsRef.current.margen = new window.Chart(margenRef.current, mkConfig(serie.map(s => s.margen), v => v == null ? '—' : `${v.toFixed(1)}%`));
                }
                if (ventasRef.current) {
                    chartsRef.current.ventas?.destroy();
                    chartsRef.current.ventas = new window.Chart(ventasRef.current, mkConfig(serie.map(s => s.ventas), v => v == null ? '—' : formatoCOP(v)));
                }
                return () => {
                    chartsRef.current.margen?.destroy();
                    chartsRef.current.margen = null;
                    chartsRef.current.ventas?.destroy();
                    chartsRef.current.ventas = null;
                };
            }, [serie, sinDatos, bounds.bucket]);

            const formatoPct = (x) => `${Number(x || 0).toFixed(1)}%`;

            return (
                <div className="space-y-6">
                    <div className="ryuu-rent-head">
                        <p className="ryuu-cell-muted">Indicadores y series calculados con las ventas sincronizadas. Se actualizan solos cada 10s.</p>
                        <div className="ryuu-rent-chips">
                            {[{ id: 'mes', l: 'Este mes' }, { id: 'trim', l: 'Últimos 3 meses' }, { id: 'anio', l: 'Este año' }].map(o => (
                                <button key={o.id} className={`ryuu-rent-chip ${rango === o.id ? 'ryuu-rent-chip--active' : ''}`} onClick={() => setRango(o.id)}>{o.l}</button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
                        <CardStat title="Margen de rentabilidad" value={formatoPct(kpis.margen)} sub={`${kpis.n} venta(s) · ${labelRango}`} icon="utilidad" tone="gold" delta={deltaAct.margen} />
                        <CardStat title="Ganancia total" value={formatoCOP(kpis.gan)} sub={`${kpis.n} venta(s) · ${labelRango}`} icon="utilidad" tone="green" delta={deltaAct.gan} />
                        <CardStat title="Ticket promedio" value={formatoCOP(kpis.ticket)} sub={`Valor por venta · ${labelRango}`} icon="calendario" tone="sky" delta={deltaAct.ticket} />
                        <CardStat title="Costo por venta" value={formatoCOP(kpis.costoProm)} sub={`Promedio del período`} icon="meta" tone="violet" delta={deltaAct.costo} />
                        <CardStat title="Más rentable" value={kpis.mejor.label} sub={kpis.mejor.valor > 0 ? `+${formatoCOP(kpis.mejor.valor)} de ganancia` : 'Sin ganancias en el período'} icon="celulares" tone="gold" delta={deltaAct.mejor} />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="ryuu-card ryuu-panel">
                            <div className="ryuu-panel__head">
                                <span className="ryuu-panel__title"><RYUIcon name="utilidad" className="ryuu-panel__ico" /> Rentabilidad en el tiempo</span>
                            </div>
                            <div className="ryuu-chart-wrap">
                                {sinDatos ? (
                                    <div className="ryuu-chart-msg"><RYUIcon name="rentabilidad" className="ryuu-chart-ico" />Aún no hay ventas en {labelRango.toLowerCase()}. Los gráficos aparecerán cuando registres ventas.</div>
                                ) : !chartOk ? (
                                    <div className="ryuu-chart-msg"><RYUIcon name="rentabilidad" className="ryuu-chart-ico" />Chart.js no se pudo cargar. Revisa tu conexión.</div>
                                ) : (
                                    <canvas ref={margenRef} />
                                )}
                            </div>
                        </div>
                        <div className="ryuu-card ryuu-panel">
                            <div className="ryuu-panel__head">
                                <span className="ryuu-panel__title"><RYUIcon name="ventas" className="ryuu-panel__ico" /> Ventas en el tiempo</span>
                            </div>
                            <div className="ryuu-chart-wrap">
                                {sinDatos ? (
                                    <div className="ryuu-chart-msg"><RYUIcon name="rentabilidad" className="ryuu-chart-ico" />Aún no hay ventas en {labelRango.toLowerCase()}. Los gráficos aparecerán cuando registres ventas.</div>
                                ) : !chartOk ? (
                                    <div className="ryuu-chart-msg"><RYUIcon name="rentabilidad" className="ryuu-chart-ico" />Chart.js no se pudo cargar. Revisa tu conexión.</div>
                                ) : (
                                    <canvas ref={ventasRef} />
                                )}
                            </div>
                        </div>
                    </div>

                    <PanelHistorialVentas ventas={ventas} accesorios={accesorios} esAdmin={esAdmin} callGAS={callGAS} onUpdate={onUpdate} />
                </div>
            );
        }

        // ==========================================
        // VISTA 2: VENDER (celular o accesorio)
        // ==========================================
        function VistaVender({ session, callGAS, unidades, accesorios, onComplete }) {
            const [tipo, setTipo] = useState('celular');
            const [unidadId, setUnidadId] = useState('');
            const [productoId, setProductoId] = useState('');
            const [cantidad, setCantidad] = useState(1);
            const [valorVenta, setValorVenta] = useState('');
            const [cliente, setCliente] = useState('');
            const [nota, setNota] = useState('');
            const [metodoPago, setMetodoPago] = useState('Efectivo');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [regalo, setRegalo] = useState(false);
            const [regaloAccId, setRegaloAccId] = useState('');

            const disponibles = useMemo(() => unidades.filter(c => c.estado === 'disponible'), [unidades]);

            const unidadSeleccionada = disponibles.find(c => String(c.id) === String(unidadId));
            const accesorioSeleccionado = accesorios.find(a => String(a.id) === String(productoId));
            const regaloSeleccionado = tipo === 'celular' && regalo && regaloAccId
                ? accesorios.find(a => String(a.id) === String(regaloAccId))
                : null;
            const costoBase = tipo === 'celular'
                ? Number(unidadSeleccionada?.costo_real || 0)
                : Number(accesorioSeleccionado?.costo || 0) * Number(cantidad || 1);
            const costoTotal = costoBase + (regaloSeleccionado ? Number(regaloSeleccionado.costo || 0) : 0);
            const gananciaEst = Number(valorVenta || 0) - costoTotal;
            const accesoriosRegalables = accesorios.filter(a => Number(a.stock) >= 1);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                if (!cliente) { setError('Ingresa el nombre del cliente.'); return; }
                if (tipo === 'celular' && !unidadId) { setError('Selecciona un celular.'); return; }
                if (tipo === 'accesorio' && !productoId) { setError('Selecciona un accesorio.'); return; }
                if (tipo === 'celular' && regalo && !regaloAccId) { setError('Selecciona el accesorio que vas a regalar.'); return; }

                setLoading(true);
                try {
                    await callGAS('registrarVenta', {
                        tipo_producto: tipo,
                        unidad_id: tipo === 'celular' ? unidadId : undefined,
                        producto_id: tipo === 'accesorio' ? productoId : undefined,
                        imei: tipo === 'celular' ? unidadSeleccionada?.imei : '',
                        vendedor_id: session.id,
                        nombre_cliente: cliente,
                        nota,
                        metodo_pago: metodoPago,
                        cantidad: tipo === 'accesorio' ? Number(cantidad) : 1,
                        valor_venta: Number(valorVenta),
                        costo_total: costoBase,
                        ganancia: gananciaEst,
                        accesorio_regalo_id: tipo === 'celular' && regalo ? regaloAccId : undefined
                    });
                    alert('¡Venta registrada con éxito!');
                    onComplete();
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="ryuu-card ryuu-selling">
                    <div className="ryuu-selling__head">
                        <span className="ryuu-selling__mark"><RYUIcon name="vender" className="ryuu-selling__ico" /></span>
                        <span>
                            <span className="ryuu-selling__title">Nueva Venta</span>
                            <span className="ryuu-selling__sub" style={{ display: 'block' }}>Registra la venta de un celular o un accesorio</span>
                        </span>
                    </div>
                    {error && <div className="ryuu-alert ryuu-alert--error">{error}</div>}
                    <form onSubmit={handleSubmit} className="ryuu-selling__form">
                        <div className="ryuu-field">
                            <label className="ryuu-label">Tipo de Producto</label>
                            <select value={tipo} onChange={e => { setTipo(e.target.value); setUnidadId(''); setProductoId(''); setValorVenta(''); setRegalo(false); setRegaloAccId(''); }} className="ryuu-select">
                                <option value="celular">Celular</option>
                                <option value="accesorio">Accesorio</option>
                            </select>
                        </div>

                        {tipo === 'celular' ? (
                            <>
                                <div className="ryuu-field">
                                    <label className="ryuu-label">Seleccionar Celular (IMEI en Stock)</label>
                                    <select value={unidadId} onChange={e => { setUnidadId(e.target.value); const c = disponibles.find(x => String(x.id) === e.target.value); setValorVenta(c ? c.precio_venta_real : ''); }} required className="ryuu-select">
                                        <option value="">-- Elige un celular --</option>
                                        {disponibles.map((c, i) => (
                                            <option key={i} value={c.id}>
                                                {c.capacidad} / {c.grado} - IMEI: {c.imei} | Ref: {formatoCOP(c.precio_venta_real)}
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <div className="ryuu-field">
                                    <label className="ryuu-label ryuu-checkbox-row">
                                        <input type="checkbox" checked={regalo} onChange={e => { setRegalo(e.target.checked); if (!e.target.checked) setRegaloAccId(''); }} className="ryuu-checkbox" />
                                        <span>Agregar regalo (descuenta stock del accesorio)</span>
                                    </label>
                                    {regalo && (
                                        <select value={regaloAccId} onChange={e => setRegaloAccId(e.target.value)} className="ryuu-select" style={{ marginTop: '8px' }}>
                                            <option value="">-- Selecciona el accesorio a regalar --</option>
                                            {accesoriosRegalables.map((a, i) => (
                                                <option key={i} value={a.id}>{a.nombre} (stock: {a.stock}) · Costo {formatoCOP(a.costo)}</option>
                                            ))}
                                        </select>
                                    )}
                                    {regalo && accesoriosRegalables.length === 0 && (
                                        <p className="ryuu-cell-muted" style={{ marginTop: '8px', fontSize: 13 }}>No hay accesorios con stock disponible para regalar.</p>
                                    )}
                                </div>
                            </>
                        ) : (
                            <div className="grid grid-cols-2 gap-3">
                                <div className="ryuu-field">
                                    <label className="ryuu-label">Accesorio</label>
                                    <select value={productoId} onChange={e => { setProductoId(e.target.value); const a = accesorios.find(x => String(x.id) === e.target.value); setValorVenta(a ? a.precio_recomendado : ''); }} required className="ryuu-select">
                                        <option value="">-- Elige --</option>
                                        {accesorios.map((a, i) => (
                                            <option key={i} value={a.id}>{a.nombre} (stock: {a.stock})</option>
                                        ))}
                                    </select>
                                </div>
                                <div className="ryuu-field">
                                    <label className="ryuu-label">Cantidad</label>
                                    <input type="number" min="1" value={cantidad} onChange={e => setCantidad(e.target.value)} className="ryuu-input" />
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-3">
                            <div className="ryuu-field">
                                <label className="ryuu-label">Precio de Venta (COP)</label>
                                <input type="number" value={valorVenta} onChange={e => setValorVenta(e.target.value)} required className="ryuu-input ryuu-num-input" />
                            </div>
                            <div className="ryuu-field">
                                <label className="ryuu-label">Medio de Pago</label>
                                <select value={metodoPago} onChange={e => setMetodoPago(e.target.value)} className="ryuu-select">
                                    <option value="Efectivo">Efectivo</option>
                                    <option value="Nequi">Nequi</option>
                                    <option value="Tarjeta">Tarjeta</option>
                                    <option value="Addi">Addi</option>
                                </select>
                            </div>
                        </div>

                        {valorVenta && (
                            <div className="ryuu-selling__summary">
                                <span>Costo: <strong>{formatoCOP(costoTotal)}</strong></span>
                                {regaloSeleccionado && <span className="ryuu-sum-item">Regalo: {regaloSeleccionado.nombre} (−{formatoCOP(regaloSeleccionado.costo)})</span>}
                                <span className="ryuu-sum-util">Utilidad Est.: {formatoCOP(gananciaEst)}</span>
                            </div>
                        )}

                        <div className="ryuu-field">
                            <label className="ryuu-label">Nombre del Cliente</label>
                            <input type="text" value={cliente} onChange={e => setCliente(e.target.value)} required placeholder="Nombre o Cédula" className="ryuu-input" />
                        </div>

                        <div className="ryuu-field">
                            <label className="ryuu-label">Nota</label>
                            <input type="text" value={nota} onChange={e => setNota(e.target.value)} placeholder="Garantía, observaciones, etc." className="ryuu-input" />
                        </div>

                        <button type="submit" disabled={loading} className="ryuu-btn ryuu-btn--gold ryuu-btn--block ryuu-btn--lg">
                            {loading ? 'Procesando Venta...' : 'Completar Venta'}
                        </button>
                    </form>
                </div>
            );
        }

        // ==========================================
        // VISTA 3: INVENTARIO CELULARES
        // ==========================================
        function VistaCelulares({ unidades, modelos, esAdmin, callGAS, onUpdate }) {
            const [showModal, setShowModal] = useState(false);
            const [error, setError] = useState('');
            const [busqueda, setBusqueda] = useState('');
            const [filtroEstado, setFiltroEstado] = useState('todos');
            const [filtroModelo, setFiltroModelo] = useState('todos');
            const [filtroCapacidad, setFiltroCapacidad] = useState('todos');
            const [filtroGrado, setFiltroGrado] = useState('todos');
            const [historialData, setHistorialData] = useState(null);
            const [historialLoading, setHistorialLoading] = useState(false);
            const [historialError, setHistorialError] = useState('');

            const verHistorial = async (imei) => {
                if (!imei) return;
                setHistorialLoading(true);
                setHistorialError('');
                try {
                    const data = await callGAS('getHistorialIMEI', { imei });
                    setHistorialData(data);
                } catch (err) {
                    setHistorialError(err.message);
                    setHistorialData(null);
                } finally {
                    setHistorialLoading(false);
                }
            };

            const fmtHora = (f) => {
                if (!f) return '—';
                try {
                    const d = new Date(f);
                    if (isNaN(d.getTime())) return String(f);
                    return d.toLocaleString('es-CO', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
                } catch (e) {
                    return '—';
                }
            };

            const accionBadge = (accion) => {
                const a = String(accion).toLowerCase();
                if (a === 'ingreso') return 'ryuu-badge ryuu-badge--ok';
                if (a === 'venta') return 'ryuu-badge ryuu-badge--sell';
                if (a === 'anulacion' || a === 'edicion') return 'ryuu-badge ryuu-badge--warn';
                return 'ryuu-badge ryuu-badge--muted';
            };

            const modelosIniciales = [
                "iPhone 8", "iPhone 8 Plus", "iPhone X", "iPhone XR", "iPhone XS", "iPhone XS Max",
                "iPhone 11", "iPhone 11 Pro", "iPhone 11 Pro Max",
                "iPhone 12", "iPhone 12 mini", "iPhone 12 Pro", "iPhone 12 Pro Max",
                "iPhone 13", "iPhone 13 mini", "iPhone 13 Pro", "iPhone 13 Pro Max",
                "iPhone 14", "iPhone 14 Plus", "iPhone 14 Pro", "iPhone 14 Pro Max",
                "iPhone 15", "iPhone 15 Plus", "iPhone 15 Pro", "iPhone 15 Pro Max",
                "iPhone 16", "iPhone 16 Plus", "iPhone 16 Pro", "iPhone 16 Pro Max",
                "iPhone 17", "iPhone 17 Pro", "iPhone 17 Pro Max",
                "iPhone 18", "iPhone 18 Pro", "iPhone 18 Pro Max"
            ];

            const listaModelosUnica = useMemo(() => {
                const nombresGS = (modelos || []).map(m => m.nombre).filter(Boolean);
                const combinados = [...modelosIniciales, ...nombresGS];
                return [...new Set(combinados)];
            }, [modelos]);

            const handleAdd = async (e) => {
                e.preventDefault();
                setError('');
                const form = e.target;
                const selectedModelo = form.modelo_id.value;
                const nuevoModeloInput = form.nuevo_modelo ? form.nuevo_modelo.value.trim() : '';

                let modeloFinal = selectedModelo;

                try {
                    if (nuevoModeloInput) {
                        await callGAS('agregarModelo', {
                            nombre: nuevoModeloInput,
                            precio_referencia_usd: 0,
                            precio_referencia_cop: 0
                        });
                        modeloFinal = nuevoModeloInput;
                    }

                    if (!modeloFinal) {
                        throw new Error('Por favor selecciona un modelo del menú o ingresa un nuevo modelo.');
                    }

                    await callGAS('agregarCelular', {
                        modelo_id: modeloFinal,
                        color: form.color.value.trim(),
                        imei: form.imei.value,
                        capacidad: form.capacidad.value,
                        grado: form.grado.value,
                        costo_real: Number(form.costo_real.value),
                        precio_venta_real: Number(form.precio_venta_real.value)
                    });
                    setShowModal(false);
                    form.reset();
                    onUpdate();
                } catch (err) {
                    setError(err.message);
                }
            };

            const unidadesData = unidades || [];
            const contEstado = (est) => est === 'todos'
                ? unidadesData.length
                : unidadesData.filter(c => String(c.estado).toLowerCase() === est).length;

            const valorDisponible = unidadesData.reduce((acc, c) =>
                String(c.estado).toLowerCase() === 'disponible' ? acc + (Number(c.precio_venta_real) || 0) : acc, 0);

            const opcionesModelo = useMemo(() => [...new Set(unidadesData.map(c => c.modelo_id).filter(Boolean))].sort(), [unidadesData]);
            const opcionesCapacidad = useMemo(() => [...new Set(unidadesData.map(c => c.capacidad).filter(Boolean))].sort(), [unidadesData]);
            const opcionesGrado = useMemo(() => [...new Set(unidadesData.map(c => c.grado).filter(Boolean))].sort(), [unidadesData]);

            const unidadesFiltradas = useMemo(() => {
                const busq = normalizarBusqueda(busqueda);
                return unidadesData.filter(c => {
                    if (filtroEstado !== 'todos' && String(c.estado).toLowerCase() !== filtroEstado) return false;
                    if (filtroModelo !== 'todos' && c.modelo_id !== filtroModelo) return false;
                    if (filtroCapacidad !== 'todos' && c.capacidad !== filtroCapacidad) return false;
                    if (filtroGrado !== 'todos' && c.grado !== filtroGrado) return false;
                    if (!busq) return true;
                    const stack = normalizarBusqueda([c.imei, c.modelo_id, c.color, c.capacidad, c.grado].join(' '));
                    return stack.includes(busq);
                });
            }, [unidades, busqueda, filtroEstado, filtroModelo, filtroCapacidad, filtroGrado]);

            const hayBateria = unidadesData.some(c => c.bateria !== undefined || c.porcentaje_bateria !== undefined || c.porcentajeBateria !== undefined);

            const renderBateria = (c) => {
                const b = c.bateria !== undefined ? c.bateria : (c.porcentaje_bateria !== undefined ? c.porcentaje_bateria : c.porcentajeBateria);
                if (b === undefined || b === null || b === '') return <span className="ryuu-cell-muted">—</span>;
                const num = Math.max(0, Math.min(100, Number(b)));
                return (
                    <div className="ryuu-bat">
                        <span className="ryuu-bat__pct">🔋 {b}%</span>
                        <span className="ryuu-bat__track"><span className={`ryuu-bat__fill ryuu-bat__fill--${num <= 20 ? 'low' : num <= 60 ? 'mid' : 'high'}`} style={{ width: num + '%' }} /></span>
                    </div>
                );
            };

            const badgeEstado = (est) => {
                const e = String(est).toLowerCase();
                if (e === 'disponible') return 'ryuu-badge ryuu-badge--ok';
                if (e === 'vendido') return 'ryuu-badge ryuu-badge--sell';
                if (e === 'reservado') return 'ryuu-badge ryuu-badge--warn';
                return 'ryuu-badge ryuu-badge--muted';
            };

            const chips = [
                { id: 'todos', label: 'Todos' },
                { id: 'disponible', label: 'Disponibles' },
                { id: 'vendido', label: 'Vendidos' },
                { id: 'reservado', label: 'Reservados' }
            ];

            const utilidadPct = (c) => {
                const costo = Number(c.costo_real) || 0;
                const precio = Number(c.precio_venta_real) || 0;
                if (!costo) return '—';
                return Math.round(((precio - costo) / costo) * 100) + '%';
            };

            return (
                <div className="ryuu-inv">
                    <header className="ryuu-inv__head">
                        <div className="ryuu-inv__heading">
                            <h1 className="ryuu-inv__title">Inventario</h1>
                            <p className="ryuu-inv__subtitle">Control de equipos y existencias</p>
                        </div>
                        {esAdmin && (
                            <button onClick={() => setShowModal(true)} className="ryuu-btn ryuu-btn--gold">
                                <span className="ryuu-btn__plus">＋</span>
                                Agregar Equipo
                            </button>
                        )}
                    </header>

                    <div className="ryuu-stats">
                        <div className="ryuu-stat">
                            <span className="ryuu-stat__ico">📱</span>
                            <div>
                                <span className="ryuu-stat__k">Equipos</span>
                                <span className="ryuu-stat__v">{unidadesData.length}</span>
                            </div>
                        </div>
                        <div className="ryuu-stat">
                            <span className="ryuu-stat__ico">🟢</span>
                            <div>
                                <span className="ryuu-stat__k">Disponibles</span>
                                <span className="ryuu-stat__v">{contEstado('disponible')}</span>
                            </div>
                        </div>
                        <div className="ryuu-stat ryuu-stat--gold">
                            <span className="ryuu-stat__ico">💰</span>
                            <div>
                                <span className="ryuu-stat__k">Valor en inventario</span>
                                <span className="ryuu-stat__v">{formatoCOP(valorDisponible)}</span>
                            </div>
                        </div>
                    </div>

                    <div className="ryuu-inv__toolbar">
                        <div className="ryuu-search ryuu-search--big">
                            <svg className="ryuu-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <circle cx="11" cy="11" r="7" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                            </svg>
                            <input
                                type="text"
                                value={busqueda}
                                onChange={e => setBusqueda(e.target.value)}
                                placeholder="Buscar equipo, modelo, IMEI, capacidad o color..."
                                className="ryuu-search__input"
                            />
                            {busqueda && (
                                <button className="ryuu-search__clear" onClick={() => setBusqueda('')} aria-label="Limpiar búsqueda">×</button>
                            )}
                        </div>

                        <div className="ryuu-filters">
                            <div className="ryuu-chips ryuu-filters__chips">
                                {chips.map(ch => (
                                    <button
                                        key={ch.id}
                                        onClick={() => setFiltroEstado(ch.id)}
                                        className={`ryuu-chip ${filtroEstado === ch.id ? 'ryuu-chip--active' : ''}`}
                                    >
                                        <span className="ryuu-chip__label">{ch.label}</span>
                                        <span className="ryuu-chip__count">{contEstado(ch.id)}</span>
                                    </button>
                                ))}

        // ==========================================
        // VISTA 5.5: REFERENCIA DE RETOMA
        // ==========================================
        function VistaRetoma({ retomas, modelos, esAdmin, callGAS, onUpdate }) {
            const [busqueda, setBusqueda] = useState('');
            const [editTarget, setEditTarget] = useState(null);
            const [editModelo, setEditModelo] = useState('');
            const [editCap, setEditCap] = useState('');
            const [editGradeA, setEditGradeA] = useState('');
            const [editGradeB, setEditGradeB] = useState('');
            const [editLoading, setEditLoading] = useState(false);
            const [editError, setEditError] = useState('');
            const [showAdd, setShowAdd] = useState(false);
            const [addLoading, setAddLoading] = useState(false);
            const [addError, setAddError] = useState('');
            const [addOk, setAddOk] = useState('');
            const [addModelo, setAddModelo] = useState('');
            const [semLoading, setSemLoading] = useState(false);
            const [semError, setSemError] = useState('');
            const [semOk, setSemOk] = useState('');

            const nombreModelo = (id) => {
                const base = (modelos || []).find(m => String(m.id) === String(id));
                return base ? base.nombre : String(id);
            };

            const fmtCapacidad = (cap) => {
                const c = String(cap == null || cap === undefined ? '' : cap).trim();
                if (c === '' || c === '0') return '—';
                if (String(c).replace(/\./g, '') === '1024') return '1 TB';
                return c + ' GB';
            };

            const nfMiles = new Intl.NumberFormat('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            const fmtRetoma = (v) => {
                const n = Number(v);
                if (!isFinite(n)) return null;
                const signo = n < 0 ? '-' : '';
                const abs = Math.abs(n);
                if (abs < 1000) return signo + '$' + abs.toFixed(2);
                return signo + '$' + nfMiles.format(abs);
            };

            const grupos = [];
            (retomas || []).forEach(r => {
                const gNorm = String(r.grado || '').trim().toUpperCase();
                if (gNorm !== 'A' && gNorm !== 'B') return;
                const precio = (r.precio_compra_cop === '' || r.precio_compra_cop === null || r.precio_compra_cop === undefined) ? null : Number(r.precio_compra_cop);
                let grupo = grupos.find(x =>
                    String(x.modelo_id) === String(r.modelo_id) &&
                    String(x.capacidad) === String(r.capacidad) &&
                    (!x.grados[gNorm] || Number(x.grados[gNorm].precio_compra_cop) === precio)
                );
                if (!grupo) {
                    grupo = { modelo_id: r.modelo_id, capacidad: r.capacidad, grados: { A: null, B: null } };
                    grupos.push(grupo);
                }
                grupo.grados[gNorm] = r;
            });

            let filasTabla = grupos;
            const q = normalizarBusqueda(busqueda);
            if (q) filasTabla = filasTabla.filter(gr => normalizarBusqueda(nombreModelo(gr.modelo_id) + ' ' + String(gr.capacidad)).includes(q));

            const abrirEditar = (gr) => {
                setEditTarget(gr);
                const modeloSel = (modelos || []).find(m => String(m.id) === String(gr.modelo_id))
                    || (modelos || []).find(m => String(m.nombre).trim().toUpperCase() === String(gr.modelo_id).trim().toUpperCase());
                setEditModelo(modeloSel ? String(modeloSel.id) : String(gr.modelo_id));
                setEditCap(gr.capacidad || '');
                setEditGradeA(gr.grados.A ? String(gr.grados.A.precio_compra_cop) : '');
                setEditGradeB(gr.grados.B ? String(gr.grados.B.precio_compra_cop) : '');
                setEditError('');
            };

            const guardarEdicion = async (e) => {
                e.preventDefault();
                setEditLoading(true);
                setEditError('');
                try {
                    const cap = String(editCap || '').trim();
                    if (!cap) throw new Error('Escribe la capacidad.');
                    for (const grado of ['A', 'B']) {
                        const valor = grado === 'A' ? editGradeA : editGradeB;
                        const row = editTarget.grados[grado];
                        if (valor === '' || valor === null || valor === undefined) continue;
                        if (row) {
                            await callGAS('editarReferenciaRetoma', {
                                id: row.id,
                                modelo_id: editModelo,
                                capacidad: cap,
                                grado,
                                precio_compra_usd: row.precio_compra_usd,
                                precio_compra_cop: Number(valor),
                                precio_venta_usd: row.precio_venta_usd,
                                precio_venta_cop: row.precio_venta_cop
                            });
                        } else {
                            await callGAS('agregarReferenciaRetoma', {
                                modelo_id: editModelo,
                                capacidad: cap,
                                grado,
                                precio_compra_usd: '',
                                precio_compra_cop: Number(valor),
                                precio_venta_usd: '',
                                precio_venta_cop: ''
                            });
                        }
                    }
                    setEditTarget(null);
                    onUpdate();
                } catch (err) {
                    setEditError(err.message || 'No se pudo guardar la edición.');
                } finally {
                    setEditLoading(false);
                }
            };

            const guardarNueva = async (e) => {
                e.preventDefault();
                setAddLoading(true);
                setAddError('');
                try {
                    const cap = String(e.target.capacidad.value || '').trim();
                    const ga = e.target.gradoA.value;
                    const gb = e.target.gradoB.value;
                    if (!addModelo) throw new Error('Selecciona el modelo.');
                    if (!cap) throw new Error('Escribe la capacidad.');
                    const existenDuplicados = (retomas || []).some(r => String(r.modelo_id) === String(addModelo) && String(r.capacidad).trim().toUpperCase() === cap.toUpperCase());
                    if (ga === '' && gb === '') throw new Error('Escribe al menos un precio (Grado A o Grado B).');
                    for (const [grado, valor] of [['A', ga], ['B', gb]]) {
                        if (valor === '') continue;
                        await callGAS('agregarReferenciaRetoma', {
                            modelo_id: addModelo,
                            capacidad: cap,
                            grado,
                            precio_compra_usd: '',
                            precio_compra_cop: Number(valor),
                            precio_venta_usd: '',
                            precio_venta_cop: ''
                        });
                    }
                    setShowAdd(false);
                    setAddModelo('');
                    setAddOk(existenDuplicados ? 'Referencia guardada. Ya existía ese modelo+capacidad; se muestra como fila aparte y no se borró la anterior.' : 'Referencia guardada correctamente.');
                    e.target.reset();
                    onUpdate();
                } catch (err) {
                    setAddError(err.message || 'No se pudo guardar la referencia.');
                } finally {
                    setAddLoading(false);
                }
            };

            const libres = (modelos || []).slice().sort((a, b) => String(a.nombre).localeCompare(String(b.nombre)));

            const sembrar = async () => {
                setSemLoading(true);
                setSemError('');
                setSemOk('');
                try {
                    const r = await callGAS('sembrarCatalogo');
                    const d = (r && r.data) ? r.data : {};
                    setSemOk('Catálogo listo: ' + (d.referencia_retoma || 0) + ' referencias nuevas, ' + (d.modelos_celular || 0) + ' modelos creados.');
                    onUpdate();
                } catch (err) {
                    setSemError(err.message || 'No se pudo sembrar. Verifica que el backend esté actualizado.')
                } finally {
                    setSemLoading(false);
                }
            };

            return (
                <div className="ryuu-card ryuu-panel">
                    <div className="ryuu-panel__head">
                        <span className="ryuu-panel__title">
                            <RYUIcon name="retoma" className="ryuu-panel__ico" /> Referencia de Retoma
                        </span>
                        <span className="ryuu-pill ryuu-pill--gold">{filasTabla.length} referencia(s)</span>
                    </div>

                    <div className="ryuu-inv__toolbar">
                        <div className="ryuu-search ryuu-search--big">
                            <svg className="ryuu-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <circle cx="11" cy="11" r="7" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                            </svg>
                            <input
                                type="text"
                                value={busqueda}
                                onChange={e => setBusqueda(e.target.value)}
                                placeholder="Buscar por modelo o capacidad… ej. iPhone 13, 256, Galaxy…"
                                className="ryuu-search__input"
                            />
                            {busqueda && (
                                <button className="ryuu-search__clear" onClick={() => setBusqueda('')} aria-label="Limpiar búsqueda">×</button>
                            )}
                        </div>
                        {esAdmin && (
                            <button onClick={sembrar} disabled={semLoading} className="ryuu-btn ryuu-btn--ghost" title="Carga el catálogo inicial en la hoja ReferenciaRetoma">
                                {semLoading ? 'Sembrando…' : 'Sembrar catálogo'}
                            </button>
                        )}
                        {esAdmin && (
                            <button onClick={() => { setShowAdd(true); setAddError(''); setAddOk(''); }} className="ryuu-btn ryuu-btn--gold">
                                + Agregar Referencia
                            </button>
                        )}
                    </div>

                    {semError && <div className="ryuu-alert ryuu-alert--error" style={{ marginBottom: 12 }}>⚠️ {semError}</div>}
                    {semOk && <div style={{ marginBottom: 12, background: 'rgba(212,175,55,0.12)', border: '1px solid rgba(212,175,55,0.45)', color: '#e5c95c', borderRadius: 12, padding: '10px 14px', fontSize: 13 }}>✅ {semOk}</div>}
                    {addOk && <div className="ryuu-alert ryuu-alert--ok" style={{ marginBottom: 12 }}>✅ {addOk}</div>}

                    <div className="overflow-x-auto">
                        <table className="ryuu-table">
                            <thead>
                                <tr>
                                    <th>Modelo</th>
                                    <th>Capacidad</th>
                                    <th className="ryuu-tright">Grado A</th>
                                    <th className="ryuu-tright">Grado B</th>
                                    {esAdmin && <th>Acciones</th>}
                                </tr>
                            </thead>
                            <tbody>
                                {filasTabla.map((gr, i) => (
                                    <tr key={i}>
                                        <td className="font-semibold">{nombreModelo(gr.modelo_id)}</td>
                                        <td>{fmtCapacidad(gr.capacidad)}</td>
                                        <td className="ryuu-num ryuu-num--green ryuu-tright">{gr.grados.A && gr.grados.A.precio_compra_cop !== '' && gr.grados.A.precio_compra_cop !== undefined && gr.grados.A.precio_compra_cop !== null ? fmtRetoma(gr.grados.A.precio_compra_cop) : <span className="ryuu-cell-muted">—</span>}</td>
                                        <td className="ryuu-num ryuu-tright">{gr.grados.B && gr.grados.B.precio_compra_cop !== '' && gr.grados.B.precio_compra_cop !== undefined && gr.grados.B.precio_compra_cop !== null ? fmtRetoma(gr.grados.B.precio_compra_cop) : <span className="ryuu-cell-muted">—</span>}</td>
                                        {esAdmin && (
                                            <td>
                                                <button onClick={() => abrirEditar(gr)} className="ryuu-btn ryuu-btn--xs ryuu-btn--edit">Editar</button>
                                            </td>
                                        )}
                                    </tr>
                                ))}
                                {filasTabla.length === 0 && (
                                    <tr>
                                        <td colSpan={esAdmin ? 5 : 4} className="ryuu-cell-muted ryuu-tcenter">
                                            {q ? 'No hay referencias que coincidan con la búsqueda.' : 'No hay referencias en la hoja ReferenciaRetoma. Si eres admin, usa el botón "Sembrar catálogo" para cargar el catálogo inicial.'}
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    {editTarget && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
                            <div className="ryuu-modal-card">
                                <h3 className="ryuu-modal-title">Editar Referencia</h3>
                                <p className="ryuu-modal-sub">Modifica Modelo, Capacidad o los precios. Se actualiza sobre los registros existentes (sin duplicar).</p>
                                {editError && <div className="ryuu-alert ryuu-alert--error">{editError}</div>}
                                <form onSubmit={guardarEdicion} className="space-y-3 mt-3">
                                    <div className="ryuu-field">
                                        <label className="ryuu-label">Modelo</label>
                                        <select value={editModelo} onChange={e => setEditModelo(e.target.value)} className="ryuu-select">
                                            <option value="">-- Selecciona un modelo --</option>
                                            {libres.map(m => (
                                                <option key={m.id} value={m.id}>{m.nombre}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="ryuu-field">
                                        <label className="ryuu-label">Capacidad</label>
                                        <input type="text" value={editCap} onChange={e => setEditCap(e.target.value)} required className="ryuu-input" />
                                    </div>
                                    <div className="ryuu-perdida-grid">
                                        <div className="ryuu-field">
                                            <label className="ryuu-label">Precio Grado A (COP)</label>
                                            <input type="number" value={editGradeA} onChange={e => setEditGradeA(e.target.value)} className="ryuu-input" />
                                        </div>
                                        <div className="ryuu-field">
                                            <label className="ryuu-label">Precio Grado B (COP)</label>
                                            <input type="number" value={editGradeB} onChange={e => setEditGradeB(e.target.value)} className="ryuu-input" />
                                        </div>
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setEditTarget(null)} className="ryuu-btn ryuu-btn--ghost">Cancelar</button>
                                        <button type="submit" disabled={editLoading} className="ryuu-btn ryuu-btn--gold">{editLoading ? 'Guardando…' : 'Guardar'}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showAdd && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
                            <div className="ryuu-modal-card">
                                <h3 className="ryuu-modal-title">Agregar Referencia</h3>
                                <p className="ryuu-modal-sub">Crea una referencia nueva en la hoja ReferenciaRetoma.</p>
                                {addError && <div className="ryuu-alert ryuu-alert--error">{addError}</div>}
                                <form onSubmit={guardarNueva} className="space-y-3 mt-3">
                                    <div className="ryuu-field">
                                        <label className="ryuu-label">Modelo</label>
                                        <select value={addModelo} onChange={e => setAddModelo(e.target.value)} required className="ryuu-select">
                                            <option value="">-- Selecciona un modelo --</option>
                                            {libres.map(m => (
                                                <option key={m.id} value={m.id}>{m.nombre}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="ryuu-field">
                                        <label className="ryuu-label">Capacidad</label>
                                        <input name="capacidad" type="text" required placeholder="Ej. 128, 512, 1.024 (se muestra 128 GB / 1 TB)" className="ryuu-input" />
                                    </div>
                                    <div className="ryuu-perdida-grid">
                                        <div className="ryuu-field">
                                            <label className="ryuu-label">Precio Grado A (COP)</label>
                                            <input name="gradoA" type="number" placeholder="Ej. 900000" className="ryuu-input" />
                                        </div>
                                        <div className="ryuu-field">
                                            <label className="ryuu-label">Precio Grado B (COP)</label>
                                            <input name="gradoB" type="number" placeholder="Ej. 810000" className="ryuu-input" />
                                        </div>
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setShowAdd(false)} className="ryuu-btn ryuu-btn--ghost">Cancelar</button>
                                        <button type="submit" disabled={addLoading} className="ryuu-btn ryuu-btn--gold">{addLoading ? 'Guardando…' : 'Guardar'}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // VISTA 6: EMPLEADOS
        // ==========================================
        function VistaEmpleados({ usuarios, callGAS, onUpdate }) {
            const [showModal, setShowModal] = useState(false);
            const [error, setError] = useState('');

            const handleCreate = async (e) => {
                e.preventDefault();
                setError('');
                const form = e.target;
                try {
                    await callGAS('crearEmpleado', {
                        nombre: form.nombre.value.trim(),
                        email: form.email.value.trim(),
                        password: form.password.value.trim(),
                        rol: form.rol.value
                    });
                    setShowModal(false);
                    form.reset();
                    alert('Usuario creado con éxito.');
                    onUpdate();
                } catch (err) {
                    setError(err.message);
                }
            };

            return (
                <div className="space-y-4 max-w-2xl mx-auto">
                    <div className="flex justify-between items-center">
                        <p className="text-sm text-gray-600">Usuarios con acceso al sistema.</p>
                        <button onClick={() => setShowModal(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">+ Crear Usuario</button>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border overflow-x-auto">
                        <table className="w-full text-xs text-left">
                            <thead className="bg-gray-50 uppercase text-gray-600">
                                <tr>
                                    <th className="p-3">Nombre</th>
                                    <th className="p-3">Correo</th>
                                    <th className="p-3">Rol</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {usuarios.map((u, i) => (
                                    <tr key={i} className="hover:bg-gray-50">
                                        <td className="p-3 font-medium text-gray-800">{u.nombre}</td>
                                        <td className="p-3 text-gray-500">{u.email}</td>
                                        <td className="p-3 font-bold text-indigo-600 uppercase">{u.rol}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl p-6 max-w-md w-full">
                                <h3 className="text-lg font-bold mb-3">Nuevo Usuario</h3>
                                {error && <div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-3">{error}</div>}
                                <form onSubmit={handleCreate} className="space-y-3">
                                    <input name="nombre" type="text" required placeholder="Nombre completo" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                    <input name="email" type="email" required placeholder="correo@ejemplo.com" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                    <input name="password" type="text" required placeholder="Contraseña" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                    <select name="rol" className="w-full border rounded-lg px-3 py-2 text-sm">
                                        <option value="vendedor">vendedor</option>
                                        <option value="admin">admin</option>
                                    </select>
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 border rounded-lg text-sm font-semibold">Cancelar</button>
                                        <button type="submit" className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">Crear Usuario</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
