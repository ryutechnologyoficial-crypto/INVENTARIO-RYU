        /* ---------- Mapeos temporales indigo -> RYU (se reemplazan por paso) ---------- */

        .ryuu-nav { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 14px; border-radius: 11px; font-size: 0.86rem; font-weight: 600; color: #b8b8b8; background: transparent; border: none; cursor: pointer; transition: all 0.16s ease; position: relative; font-family: inherit; }
        .ryuu-nav:hover { background: rgba(255,255,255,0.05); color: #ffffff; }
        .ryuu-nav--active { background: linear-gradient(90deg, rgba(212,175,55,0.16), rgba(212,175,55,0.02)); color: #ffffff; }
        .ryuu-nav--active::before { content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 3px; background: var(--ryuu-gold); }
        .ryuu-nav__ico { width: 19px; height: 19px; flex-shrink: 0; }

        .ryuu-side__sheetlink { display: flex; align-items: center; gap: 9px; margin: 8px 12px 0; padding: 8px 11px; border-radius: 10px; text-decoration: none; font-size: 0.8rem; font-weight: 600; color: var(--ryuu-gold-light); background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.22); transition: all 0.16s ease; }
        .ryuu-side__sheetlink:hover { background: rgba(212,175,55,0.14); border-color: rgba(212,175,55,0.45); color: var(--ryuu-gold); }
        .ryuu-side__sheet-ico { width: 16px; height: 16px; flex-shrink: 0; }

        .ryuu-side__sheetfix { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 14px; text-decoration: none; font-size: 0.8rem; font-weight: 500; color: var(--ryuu-gold-light); opacity: 0.75; transition: all 0.16s ease; }

        /* ---------- PÁGINA: HEADER GLOBAL ---------- */
        .ryuu-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--ryuu-border); }

        .ryuu-page-title::after { content: ""; display: block; width: 44px; height: 3px; margin-top: 7px; border-radius: 3px; background: linear-gradient(270deg, #e6c74f, var(--ryuu-gold)); }
        .ryuu-page-sub { margin: 8px 0 0; font-size: 0.78rem; color: var(--ryuu-muted); }

        .ryuu-sync-note__spin { display: inline-block; color: var(--ryuu-gold); font-size: 0.8rem; }
        .ryuu-sync-note__dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px rgba(52,211,153,0.8); }
        .ryuu-refresh-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.35); background: rgba(212,175,55,0.07); color: var(--ryuu-gold-light); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.16s ease; white-space: nowrap; font-family: inherit; }
        .ryuu-refresh-btn:hover:not(:disabled) { background: rgba(212,175,55,0.15); border-color: rgba(212,175,55,0.6); color: var(--ryuu-gold); }
        .ryuu-refresh-btn:disabled { opacity: 0.5; cursor: default; }
        .ryuu-refresh-btn__ico { display: inline-block; font-size: 0.85rem; line-height: 1; }

        /* ---------- KPI / Resumen ---------- */
        .ryuu-kpi { background: #ffffff; border: 1px solid #eef0f2; border-radius: 16px; padding: 18px 18px 16px; box-shadow: var(--ryuu-shadow); position: relative; overflow: hidden; transition: transform 0.16s ease, box-shadow 0.16s ease; }
        .ryuu-kpi:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,0.08); }
        .ryuu-kpi::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 3px; border-radius: 0 0 3px 3px; background: var(--kpi-c, var(--ryuu-gold)); }
        .ryuu-kpi--gold { --kpi-c: var(--ryuu-gold); }
        .ryuu-kpi--green { --kpi-c: var(--ryuu-green); }
        .ryuu-kpi--sky { --kpi-c: #0284c7; }
        .ryuu-kpi--violet { --kpi-c: #7c3aed; }
        .ryuu-kpi__head { margin-bottom: 12px; }
        .ryuu-kpi__ico { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
        .ryuu-kpi__ico-svg { width: 18px; height: 18px; }
        .ryuu-kpi--gold .ryuu-kpi__ico { background: #faf6e8; color: var(--ryuu-gold-deep); }
        .ryuu-kpi--green .ryuu-kpi__ico { background: #ecfdf5; color: var(--ryuu-green); }
        .ryuu-kpi--sky .ryuu-kpi__ico { background: #f0f9ff; color: #0284c7; }
        .ryuu-kpi--violet .ryuu-kpi__ico { background: #f5f3ff; color: #7c3aed; }
        .ryuu-kpi__title { margin: 0; font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ryuu-muted); }
        .ryuu-kpi__value { margin: 6px 0 0; font-size: 1.5rem; font-weight: 800; color: var(--ryuu-text); letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .ryuu-kpi--green .ryuu-kpi__value { color: var(--ryuu-green); }
        .ryuu-kpi--sky .ryuu-kpi__value { color: #0c4a6e; }
        .ryuu-kpi--violet .ryuu-kpi__value { color: #5b21b6; }
        .ryuu-kpi__sub { margin: 6px 0 0; font-size: 0.72rem; color: #9ca3af; }

        /* ---------- Paneles Resumen ---------- */
        .ryuu-panel { padding: 20px; }
        .ryuu-panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .ryuu-panel__title { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 700; color: var(--ryuu-text); }
        .ryuu-panel__ico { width: 34px; height: 34px; border-radius: 10px; background: #faf6e8; color: var(--ryuu-gold-deep); padding: 8px; }
        .ryuu-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; white-space: nowrap; }

        .ryuu-pill--red { background: #fef2f2; color: var(--ryuu-red); }
        .ryuu-cell-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.76rem; color: #6b7280; }
        .ryuu-num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: #111; }
        .ryuu-num--green { color: var(--ryuu-green); font-weight: 700; }
        .ryuu-num--danger { color: var(--ryuu-red); font-weight: 700; }
        .ryuu-table thead th.ryuu-tright { text-align: right; }
        .ryuu-table thead th { position: sticky; top: 0; z-index: 2; }

        /* ---------- Vender ---------- */
        .ryuu-selling { max-width: 560px; margin-left: auto; margin-right: auto; padding: 28px; }
        .ryuu-selling__head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #f1f0ed; }
        .ryuu-selling__mark { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(180deg, #e6c74f, var(--ryuu-gold)); display: flex; align-items: center; justify-content: center; color: #111; box-shadow: 0 6px 14px rgba(212,175,55,0.3); }
        .ryuu-selling__ico { width: 20px; height: 20px; }
        .ryuu-selling__title { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--ryuu-text); }

        .ryuu-sum-util { font-weight: 800; color: var(--ryuu-green); }
        .ryuu-num-input { font-weight: 700; font-variant-numeric: tabular-nums; }

        body {

        /* ---------- SIDEBAR ---------- */
        .ryuu-side {
            position: relative;
            background: linear-gradient(180deg, #171717, #0d0d0d);
            border-right: 1px solid #202020;
        }
        .ryuu-side::after {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 34%; height: 58%;

        .ryuu-card, .ryuu-kpi, .ryuu-stat {

            background: linear-gradient(180deg, #fbf6e2, #f3e5b0);

            background: linear-gradient(180deg, #fbf6e2, #f3e5b0);

            background: #ffffff;
            border-color: #e4e2da;

        /* ================== RYU TECHNOLOGY · DRAGON GOLD THEME ================== */
        :root {

            --ryuu-radius-lg: 22px;

<body class="bg-gray-100 text-gray-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // ==========================================
        // CONFIGURACIÓN DE GOOGLE APPS SCRIPT
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxrvSjVzwunRO5CfzQA1RtxcMt3HfDIVIHfmQyknSshXpmyP7OxoCO3UnOTZ9JonqPn/exec";

        const formatoCOP = (valor) => {
            if (valor === null || valor === undefined || isNaN(valor)) return "$0";
            return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(valor);
        };

        // Lee la sesión guardada, pero solo la acepta si tiene un id válido,
        // para evitar llamadas automáticas al backend sin autenticación real.
        function leerSesionGuardada() {
            try {
                const stored = JSON.parse(localStorage.getItem('gas_session') || 'null');
                if (stored && stored.id) return stored;
            } catch (e) {}
            localStorage.removeItem('gas_session');
            return null;
        }

        function App() {
            const [session, setSession] = useState(leerSesionGuardada);
            const [loading, setLoading] = useState(false);
            const [syncing, setSyncing] = useState(false);
            const [authError, setAuthError] = useState('');

            const [tab, setTab] = useState('resumen');
            const [unidades, setUnidades] = useState([]);
            const [ventas, setVentas] = useState([]);
            const [accesorios, setAccesorios] = useState([]);
            const [usuarios, setUsuarios] = useState([]);
            const [modelos, setModelos] = useState([]);
            const [retomas, setRetomas] = useState([]);
            const [configuracion, setConfiguracion] = useState([]);
            const [ssUrl, setSsUrl] = useState('');

            const esAdmin = session && session.rol === 'admin';

            // Llamada al backend de Google Apps Script.
            // Los parámetros van "planos" en el body (no anidados en "datos"),
            // tal como lo espera este backend.
            const callGAS = useCallback(async (action, payload = {}) => {
                if (GAS_URL.includes("TU_WEB_APP_URL")) {
                    throw new Error("Por favor configura la URL de tu Web App de Google Apps Script en la variable GAS_URL dentro de index.html");
                }
                setSyncing(true);
                try {
                    const bodyData = {
                        action,
                        userId: session ? session.id : null,
                        ...payload
                    };
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(bodyData)
                    });
                    const json = await response.json();
                    if (!json.success) {
                        throw new Error(json.error || 'Error en el servidor');
                    }
                    return json.data;
                } catch (err) {
                    console.error("Error GAS:", err);
                    throw err;
                } finally {
                    setSyncing(false);
                }
            }, [session]);

            const loadAllData = useCallback(async () => {
                if (!session) return;
                try {
                    const data = await callGAS('getData');
                    if (data) {
                        setSsUrl(data.ss_url || '');
                        setUnidades(data.unidades_celular || []);
                        setVentas(data.ventas || []);
                        setAccesorios(data.accesorios || []);
                        setUsuarios(data.usuarios || []);
                        setModelos(data.modelos_celular || []);
                        setRetomas(data.referencia_retoma || []);
                        setConfiguracion(data.configuracion || []);
                    }
                } catch (err) {
                    console.error("Error cargando datos:", err);
                }
            }, [session, callGAS]);

            useEffect(() => {
                if (!session) return;
                loadAllData();
                const interval = setInterval(loadAllData, 30000);
                return () => clearInterval(interval);
            }, [session, loadAllData]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                setLoading(true);
                const email = e.target.email.value.trim();
                const password = e.target.password.value.trim();

                try {
                    // El backend devuelve el usuario directamente (no envuelto en "usuario")
                    const usuario = await callGAS('login', { email, password });
                    setSession(usuario);
                    localStorage.setItem('gas_session', JSON.stringify(usuario));
                } catch (err) {
                    setAuthError(err.message || 'Error al iniciar sesión');
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = () => {
                setSession(null);
                localStorage.removeItem('gas_session');
            };

            if (!session) {
                return (
                <div className="ryuu-login">
                    <div className="ryuu-login__card">
                        <div className="ryuu-login__brand">R</div>
                        <h1 className="ryuu-login__title">RYU Technology</h1>
                        <p className="ryuu-login__subtitle">CeluControl · Iniciar Sesión</p>
                        {authError && <div className="ryuu-alert ryuu-alert--error">{authError}</div>}
                        <form onSubmit={handleLogin} className="ryuu-login__form">
                            <div className="ryuu-field">
                                <label className="ryuu-label" htmlFor="login-email">Usuario</label>
                                <input name="email" id="login-email" type="text" required className="ryuu-input ryuu-input--lg" />
                            </div>
                            <div className="ryuu-field">
                                <label className="ryuu-label" htmlFor="login-password">Contraseña</label>
                                <input name="password" id="login-password" type="password" required className="ryuu-input ryuu-input--lg" />
                            </div>
                            <button type="submit" disabled={loading} className="ryuu-btn ryuu-btn--gold ryuu-btn--block ryuu-btn--lg">
                                {loading ? 'Entrando...' : 'Entrar al Sistema'}
                            </button>
                        </form>
                    </div>
                    <p className="ryuu-login__foot">RYU Technology · CeluControl</p>
                </div>
                );
            }
            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-gray-100">
                                        <aside className="ryuu-side w-full md:w-64 flex flex-col justify-between">
                        <div>
                            <div className="ryuu-side__brand">
                                <div className="ryuu-side__logo">
                                    <span className="ryuu-side__mark">R</span>
                                    <span>
                                        <span className="ryuu-side__name">RYU CeluControl</span>
                                        <span className="ryuu-side__tag">Tecnología Premium</span>
                                    </span>
                                </div>
                                {syncing && <span className="ryuu-side__sync animate-spin" title="Sincronizando...">⟳</span>}
                            </div>

                            <div className="ryuu-side__user">
                                <span className="ryuu-side__avatar">{(session.nombre || 'U').charAt(0).toUpperCase()}</span>
                                <span>
                                    <span className="ryuu-side__uname">{session.nombre}</span>
                                    <span className="ryuu-side__rol">{session.rol}</span>
                                </span>
                            </div>

                            {ssUrl && (
                                <a href={ssUrl} target="_blank" rel="noopener noreferrer" className="ryuu-side__sheetlink" title="Abrir el Google Sheets ligado">
                                    <RYUIcon name="sheet" className="ryuu-side__sheet-ico" />
                                    <span>Abrir Google Sheets</span>
                                    <span className="ryuu-side__sheet-ext">↗</span>
                                </a>
                            )}

                            <nav className="ryuu-side__nav">
                                <NavItem active={tab === 'resumen'} onClick={() => setTab('resumen')} icon="resumen" label="Resumen y Ventas" />
                                <NavItem active={tab === 'registrar'} onClick={() => setTab('registrar')} icon="vender" label="Vender" />
                                <NavItem active={tab === 'celulares'} onClick={() => setTab('celulares')} icon="celulares" label="Inventario Celulares" />
                                <NavItem active={tab === 'accesorios'} onClick={() => setTab('accesorios')} icon="accesorios" label="Accesorios" />
                                <NavItem active={tab === 'ventas'} onClick={() => setTab('ventas')} icon="rentabilidad" label="Ventas" />
                                <NavItem active={tab === 'retoma'} onClick={() => setTab('retoma')} icon="retoma" label="Referencia de Retoma" />
                                {esAdmin && <NavItem active={tab === 'config'} onClick={() => setTab('config')} icon="config" label="Configuración / TRM" />}
                                {esAdmin && <NavItem active={tab === 'empleados'} onClick={() => setTab('empleados')} icon="usuarios" label="Usuarios" />}
                            </nav>
                        </div>

                        <div className="ryuu-side__foot">
                            {esAdmin && (
                                <a href="https://docs.google.com/spreadsheets/d/1Gig077ihhL1gDCkb_552bR5h0aFAVL8muhulKhnwe2c/edit?usp=sharing" target="_blank" rel="noopener noreferrer" className="ryuu-side__sheetfix" title="Ver en Google Sheets">
                                    <RYUIcon name="sheet" className="ryuu-side__sheetfix-ico" />
                                    <span>Ver en Google Sheets</span>
                                </a>
                            )}
                            <button onClick={handleLogout} className="ryuu-nav ryuu-side__logout">
                                <RYUIcon name="logout" className="ryuu-nav__ico" />
                                <span>Cerrar Sesión</span>
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                                            {tab !== 'celulares' && (
                        <header className="ryuu-page-head">
                            <div>
                                <h2 className="ryuu-page-title">
                                    {tab === 'resumen' && 'Resumen Financiero y Ventas'}
                                    {tab === 'registrar' && 'Registrar Venta'}
                                    {tab === 'accesorios' && 'Inventario de Accesorios'}
                                    {tab === 'ventas' && 'Ventas'}
                                    {tab === 'retoma' && 'Referencia de Retoma'}
                                    {tab === 'config' && 'Configuración y Modelos'}
                                    {tab === 'empleados' && 'Gestión de Usuarios'}
                                </h2>
                                <p className="ryuu-page-sub">
                                    {syncing ? (
                                        <span className="ryuu-sync-note">
                                            <span className="ryuu-sync-note__spin animate-spin">⟳</span>
                                            Actualizando…
                                        </span>
                                    ) : (
                                        <span className="ryuu-sync-note">
                                            <span className="ryuu-sync-note__dot" />
                                            Sincronizado
                                        </span>
                                    )}
                                </p>
                            </div>
                            <button onClick={loadAllData} disabled={syncing} className="ryuu-refresh-btn" title="Forzar actualización de datos">
                                <span className={'ryuu-refresh-btn__ico' + (syncing ? ' animate-spin' : '')}>⟳</span>
                                Actualizar ahora
                            </button>
                        </header>
                    )}

                        {tab === 'resumen' && <VistaResumen ventas={ventas} unidades={unidades} accesorios={accesorios} esAdmin={esAdmin} callGAS={callGAS} onUpdate={loadAllData} />}
                        {tab === 'registrar' && <VistaVender session={session} callGAS={callGAS} unidades={unidades} accesorios={accesorios} onComplete={() => { loadAllData(); setTab('resumen'); }} />}
                        {tab === 'celulares' && <VistaCelulares unidades={unidades} modelos={modelos} esAdmin={esAdmin} callGAS={callGAS} onUpdate={loadAllData} />}
                        {tab === 'accesorios' && <VistaAccesorios accesorios={accesorios} esAdmin={esAdmin} callGAS={callGAS} onUpdate={loadAllData} />}
                        {tab === 'ventas' && <VistaVentas ventas={ventas} unidades={unidades} modelos={modelos} accesorios={accesorios} esAdmin={esAdmin} callGAS={callGAS} onUpdate={loadAllData} />}
                        {tab === 'retoma' && <VistaRetoma retomas={retomas} modelos={modelos} esAdmin={esAdmin} callGAS={callGAS} onUpdate={loadAllData} />}
                        {tab === 'config' && esAdmin && <VistaConfig configuracion={configuracion} modelos={modelos} retomas={retomas} callGAS={callGAS} onUpdate={loadAllData} />}
                        {tab === 'empleados' && esAdmin && <VistaEmpleados usuarios={usuarios} callGAS={callGAS} onUpdate={loadAllData} />}
                    </main>
                    <ChatBotWidget unidades={unidades} modelos={modelos} accesorios={accesorios} ventas={ventas} usuarios={usuarios} />
                </div>
            );
        }

        function escaparRegex(s) {
            return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function normalizarBusqueda(s) {
            return String(s)
                .toLowerCase()
                .replace(/[áàäâ]/g, 'a')
                .replace(/[éèëê]/g, 'e')
                .replace(/[íìïî]/g, 'i')
                .replace(/[óòöô]/g, 'o')
                .replace(/[úùüû]/g, 'u')
                .replace(/ñ/g, 'n')
                .replace(/-/g, ' ')
                .replace(/[^a-z0-9 ]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function detectarColor(qNorm) {
            const colores = [
                ['negro', 'negro'], ['black', 'negro'],
                ['blanco', 'blanco'], ['white', 'blanco'],
                ['azul', 'azul'], ['blue', 'azul'],
                ['rojo', 'rojo'], ['red', 'rojo'],
                ['verde', 'verde'], ['green', 'verde'],
                ['gris', 'gris'], ['gray', 'gris'], ['grey', 'gris'],
                ['dorado', 'dorado'], ['gold', 'dorado'], ['oro', 'dorado'],
                ['plateado', 'plateado'], ['silver', 'plateado'],
                ['rosa', 'rosa'], ['pink', 'rosa'],
                ['morado', 'morado'], ['purple', 'morado'], ['violeta', 'morado'],
                ['amarillo', 'amarillo'], ['yellow', 'amarillo'],
                ['naranja', 'naranja'], ['orange', 'naranja'],
                ['titanio natural', 'titanio natural'], ['titanio', 'titanio natural'], ['natural', 'titanio natural'],
                ['grafito', 'grafito'], ['graphite', 'grafito'],
                ['celeste', 'celeste'], ['beige', 'beige'], ['champagne', 'champagne']
            ];
            for (const [token, nombre] of colores) {
                const re = new RegExp(`(^|[^a-z0-9])${escaparRegex(token)}([^a-z0-9]|$)`);
                if (re.test(qNorm)) return nombre;
            }
            return null;
        }

        function detalleUnidad(c, nombreModelo) {
            const partes = [];
            if (c.capacidad) partes.push(`Capacidad: ${c.capacidad}`);
            if (c.color) partes.push(`Color: ${c.color}`);
            if (c.grado) partes.push(`Grado: ${c.grado}`);
            if (c.imei) partes.push(`IMEI: ${c.imei}`);
            if (c.estado) partes.push(`Estado: ${c.estado}`);
            if (c.costo_real !== null && c.costo_real !== undefined && c.costo_real !== '') partes.push(`Costo: ${formatoCOP(Number(c.costo_real))}`);
            if (c.precio_venta_real !== null && c.precio_venta_real !== undefined && c.precio_venta_real !== '') partes.push(`Venta: ${formatoCOP(Number(c.precio_venta_real))}`);
            return `${nombreModelo || c.modelo_id || 'Unidad'} — ${partes.length ? partes.join(' | ') : 'Sin datos adicionales.'}`;
        }

        function ChatBotWidget({ unidades, modelos, accesorios, ventas, usuarios }) {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([
                { sender: 'assistant', text: '¡Hola! Soy el asistente interno de CeluControl para RYU Technology. ¿En qué puedo ayudarte hoy con tu inventario, ventas, costos, precios o cálculos del negocio?' }
            ]);
            const [inputValue, setInputValue] = useState('');
            const [contexto, setContexto] = useState(null);

            const handleSend = (e) => {
                e.preventDefault();
                if (!inputValue.trim()) return;

                const userText = inputValue.trim();
                const newMessages = [...messages, { sender: 'user', text: userText }];
                setMessages(newMessages);
                setInputValue('');

                const q = userText.toLowerCase().trim();
                const normalize = (s) => String(s).toLowerCase().replace(/\s+/g, ' ').trim();
                const qNorm = normalize(q);
                let reply = "";

                const totalUnidades = (unidades || []).length;
                const disponibles = (unidades || []).filter(c => String(c.estado).toLowerCase() === 'disponible').length;

                const mathBuyMatch = q.match(/compro\s+(\d+)\s+unidad[es]*\s+a\s+\$?([\d\.,\s]+)\s+y.*vendo\s+a\s+\$?([\d\.,\s]+)/i);
                const percentOfMatch = q.match(/(?:cuanto\s+es\s+el\s+|el\s+)(\d+(?:\.\d+)?)\s*%\s+de\s+\$?([\d\.,\s]+)/i);
                const descMatch = q.match(/descuento\s+d[e|el]\s+(\d+(?:\.\d+)?)\s*%/i);

                const unrelatedKeywords = ['futbol', 'partido', 'clima', 'pelicula', 'presidente', 'cocinar', 'receta', 'musica', 'chiste', 'elecciones', 'cancion', 'tiempo libre'];
                const isUnrelated = unrelatedKeywords.some(keyword => q.includes(keyword)) && !q.includes('inventario') && !q.includes('venta') && !q.includes('celular') && !q.includes('accesorio');

                // Dynamic accessory search (exact, word-boundary)
                let matchedAccessory = null;
                for (const acc of (accesorios || [])) {
                    if (acc.nombre) {
                        const accName = normalize(acc.nombre);
                        const escapedAcc = accName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const accRe = new RegExp(`(^|[^a-z0-9])${escapedAcc}([^a-z0-9]|$)`);
                        if (accRe.test(qNorm)) {
                            matchedAccessory = acc;
                            break;
                        }
                    }
                }

                // Dynamic cell model search (exact match, longest name first)
                let matchedModel = null;
                const knownModels = [...new Set([...(modelos || []).map(m => m.nombre), ...(unidades || []).map(c => c.modelo_id)].filter(Boolean))]
                    .sort((a, b) => String(b).length - String(a).length);
                for (const mod of knownModels) {
                    const modName = normalize(mod);
                    const escaped = modName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const re = new RegExp(`(^|[^a-z0-9])${escaped}([^a-z0-9]|$)`);
                    if (re.test(qNorm)) {
                        matchedModel = mod;
                        break;
                    }
                }

                if (!matchedModel && contexto && contexto.modelo) {
                    const indicsContexto = ['el mas barato', 'el mas caro', 'mas econom', 'mas barato', 'mas caro', 'el de 256', 'el de 128', 'el de 512', 'ese celular', 'ese equipo', 'ese telefono', 'ese iphone', 'el modelo', 'el equipo'];
                    if (indicsContexto.some(fr => qNorm.includes(fr))) {
                        matchedModel = contexto.modelo;

                    const isSell = qNorm.includes('se vende') || qNorm.includes('vender') || qNorm.includes('venta') || qNorm.includes('vendo') || qNorm.includes('precio') || qNorm.includes('vale') || qNorm.includes('pedir') || qNorm.includes('a como') || qNorm.includes('a cuant') || qNorm.includes('sugerid');
                    const consultaCombinada = isBuyCost && isSell;
                    const isProfit = qNorm.includes('gano') || qNorm.includes('ganancia') || qNorm.includes('ganar') || qNorm.includes('utilidad') || qNorm.includes('gane') || qNorm.includes('ganamos') || qNorm.includes('puedo ganar') || qNorm.includes('le gano');
                    const isMargin = qNorm.includes('margen') || qNorm.includes('porcentaje de util');
                    const isInvestModelo = qNorm.includes('invertid') || qNorm.includes('inversion');
                    const isRevenue = qNorm.includes('recibo si vendo') || qNorm.includes('recaudo si vendo') || qNorm.includes('dinero recibo') || qNorm.includes('sacaria si vendo');
                    const isStock = !isBuyCost && !isSell && !isProfit && !isMargin && !isInvestModelo && !isRevenue;
                    const isInfo = qNorm.includes('informacion') || qNorm.includes('info de') || (qNorm.includes('toda') && qNorm.includes('informa')) || qNorm.includes('muestrame') || qNorm.includes('listame') || (qNorm.includes('que') && qNorm.includes('tengo'));
                    const esVentaPasada = qNorm.includes('vendid') || qNorm.includes('vendi') || qNorm.includes('vendier') || qNorm.includes('vendim') || qNorm.includes('se vendio') || qNorm.includes('sold') || qNorm.includes('vendiamos');
                    const quiereBateria = qNorm.includes('bateria') || qNorm.includes('pila') || qNorm.includes('duracion de');

                    const getEstado = (c) => String(c.estado || '').toLowerCase();
                    const dispArr = unidadesModelo.filter(c => getEstado(c) === 'disponible');
                    const listaBase = dispArr.length > 0 ? dispArr : unidadesModelo;

                    if (quiereBateria) {
                        reply = "No tengo ese dato disponible en CeluControl.";
                    } else if (esVentaPasada) {
                        const vendidas = (unidades || []).filter(c => modRe.test(normalize(String(c.modelo_id || '').toLowerCase())) && String(c.estado || '').toLowerCase().includes('vendid'));
                        const imeisModelo = new Set((unidades || []).filter(c => modRe.test(normalize(String(c.modelo_id || '').toLowerCase()))).map(c => String(c.imei || '')));
                        const ventasPorImei = (ventas || []).filter(v => v.imei && imeisModelo.has(String(v.imei)));
                        const fuente = (vendidas.length > 0 ? vendidas : ventasPorImei);
                        if (fuente.length === 0) {
                            reply = `No tengo registros de ${matchedModel} vendidos en CeluControl.`;
                        } else {
                            const lineas = fuente.map((c, i) => {
                                const imei = String(c.imei || '');
                                const vv = (ventas || []).find(v => v.imei && String(v.imei) === imei);
                                let txt = `${i + 1}. ${detalleUnidad(c, matchedModel)}`;
                                if (vv) {
                                    txt += ` | Vendido en ${formatoCOP(Number(vv.valor_venta || 0))}`;
                                    if (vv.fecha_hora) txt += ` | Fecha: ${vv.fecha_hora}`;
                                    if (vv.ganancia !== undefined && vv.ganancia !== null && vv.ganancia !== '') txt += ` | Ganancia: ${formatoCOP(Number(vv.ganancia))}`;
                                    if (vv.nombre_cliente) txt += ` | Cliente: ${vv.nombre_cliente}`;
                                    if (vv.vendedor_id) {
                                        const nombreV = (usuarios || []).find(u => String(u.id) === String(vv.vendedor_id));
                                        if (nombreV && nombreV.nombre) txt += ` | Vendido por: ${nombreV.nombre}`;
                                    }
                                }
                                return txt;
                            }).join('\n');
                            reply = `${matchedModel} vendidos (${fuente.length}):\n${lineas}`;
                        }
                    } else if (unidadesModelo.length === 0) {
                        reply = colorBuscado ? `No encontré unidades de ${matchedModel} de color ${colorBuscado} en el inventario.` : `No encontré unidades de ${matchedModel} en el inventario.`;
                    } else if (qNorm.includes('color') || qNorm.includes('colores')) {
                        const coloresArr = [...new Set(unidadesModelo.map(c => c.color).filter(Boolean))];
                        reply = coloresArr.length ? `Colores de ${matchedModel}: ${coloresArr.join(', ')}.` : `No tengo colores registrados para ${matchedModel}.`;
                    } else if (imeiMatch) {
                        const unidad = unidadesModelo.find(c => String(c.imei || '').includes(imeiMatch[1]));
                        if (unidad) {
                            let txt = `${detalleUnidad(unidad, matchedModel)}`;
                            const vv = (ventas || []).find(v => v.imei && String(v.imei) === String(unidad.imei));
                            if (vv && (vv.valor_venta !== undefined && vv.valor_venta !== null && vv.valor_venta !== '')) {
                                txt += ` | Vendido en ${formatoCOP(Number(vv.valor_venta))}${vv.fecha_hora ? ` | Fecha: ${vv.fecha_hora}` : ''}`;
                                if (vv.ganancia !== undefined && vv.ganancia !== null && vv.ganancia !== '') txt += ` | Ganancia: ${formatoCOP(Number(vv.ganancia))}`;
                            }
                            if (isBuyCost) {
                                reply = `${matchedModel} (IMEI ${unidad.imei}): recibido en ${formatoCOP(Number(unidad.costo_real || 0))}.`;
                            } else if (isSell) {
                                reply = `${matchedModel} (IMEI ${unidad.imei}): precio de venta ${formatoCOP(Number(unidad.precio_venta_real || 0))}.`;
                            } else {
                                reply = txt;
                            }
                        } else {
                            reply = `No encontré una unidad de ${matchedModel} con ese IMEI.`;
                        }
                    } else if (isInfo && !isBuyCost && !isSell && !isProfit && !isMargin) {
                        reply = `${matchedModel} (${unidadesModelo.length} unidad(es)):\n` + unidadesModelo.map((c, i) => `${i + 1}. ${detalleUnidad(c)}`).join('\n');
                    } else if (qNorm.includes('barato') || qNorm.includes('econom') || qNorm.includes('caro')) {
                        const conPrecio = unidadesModelo.filter(c => c.precio_venta_real !== null && c.precio_venta_real !== undefined && c.precio_venta_real !== '');
                        if (conPrecio.length === 0) {
                            reply = "No tengo precios de venta registrados para calcular eso.";
                        } else {
                            let sel;
                            if (qNorm.includes('barato') || qNorm.includes('econom')) sel = conPrecio.reduce((a, b) => Number(a.precio_venta_real) <= Number(b.precio_venta_real) ? a : b);
                            else sel = conPrecio.reduce((a, b) => Number(a.precio_venta_real) >= Number(b.precio_venta_real) ? a : b);
                            reply = `El más ${qNorm.includes('caro') ? 'caro' : 'económico'} es: ${detalleUnidad(sel, matchedModel)}.`;
                        }
                    } else if (isInvestModelo) {
                        const inv = unidadesModelo.reduce((acc, c) => acc + Number(c.costo_real || 0), 0);
                        reply = `Tienes invertido ${formatoCOP(inv)} en ${unidadesModelo.length} unidad(es) de ${matchedModel}.`;
                    } else if (isRevenue) {
                        const rev = unidadesModelo.reduce((acc, c) => acc + Number(c.precio_venta_real || 0), 0);
                        reply = `Vendiendo todos los ${matchedModel} (${unidadesModelo.length} unidades) recibirías ${formatoCOP(rev)}.`;
                    } else if (consultaCombinada) {
                        if (listaBase.length === 1) {
                            const c = listaBase[0];
                            reply = `${matchedModel}: recibido en ${formatoCOP(Number(c.costo_real || 0))} → venta sugerida ${formatoCOP(Number(c.precio_venta_real || 0))}.`;
                        } else {
                            const lineas = listaBase.map((c, i) => `• Unidad ${i + 1}: recibido ${formatoCOP(Number(c.costo_real || 0))} → venta sugerida ${formatoCOP(Number(c.precio_venta_real || 0))}`).join('\n');
                            reply = `${matchedModel} — cada unidad tiene su propio costo y venta:\n${lineas}`;
                        }
                    } else if (isBuyCost && !isSell) {
                        if (listaBase.length === 1) {
                            reply = `${matchedModel}: recibido en ${formatoCOP(Number(listaBase[0].costo_real || 0))}.`;
                        } else {
                            const lineas = listaBase.map((c, i) => `• Unidad ${i + 1} (${c.capacidad || ''}${c.color ? ', ' + c.color : ''}${c.imei ? ' IMEI ' + c.imei : ''}): recibido en ${formatoCOP(Number(c.costo_real || 0))}`).join('\n');
                            reply = colorBuscado ? `${matchedModel} de color ${colorBuscado} — cada unidad tiene su propio costo:\n${lineas}` : `${matchedModel} — cada unidad tiene su propio costo:\n${lineas}`;
                        }
                    } else if (isSell && !isBuyCost) {
                        const precios = [...new Set(listaBase.map(c => Number(c.precio_venta_real || 0)))];
                        if (precios.length === 1) {
                            reply = `${matchedModel}: precio sugerido de venta ${formatoCOP(precios[0])}.`;
                        } else {
                            const lineas = listaBase.map((c, i) => `• Unidad ${i + 1} (${c.capacidad || ''}${c.color ? ', ' + c.color : ''}${c.imei ? ' IMEI ' + c.imei : ''}): venta sugerida ${formatoCOP(Number(c.precio_venta_real || 0))}`).join('\n');
                            reply = `${matchedModel} — precios de venta por unidad:\n${lineas}`;
                        }
                    } else if (isProfit) {
                        const ganTotal = listaBase.reduce((acc, c) => acc + (Number(c.precio_venta_real || 0) - Number(c.costo_real || 0)), 0);
                        if (listaBase.length === 1) {
                            const c = listaBase[0];
                            reply = `Ganancia por ${matchedModel}: ${formatoCOP(Number(c.precio_venta_real || 0) - Number(c.costo_real || 0))} (Venta: ${formatoCOP(Number(c.precio_venta_real || 0))} - Costo: ${formatoCOP(Number(c.costo_real || 0))}).`;
                        } else {
                            const lineas = listaBase.map((c, i) => `• Unidad ${i + 1}: ganancia ${formatoCOP(Number(c.precio_venta_real || 0) - Number(c.costo_real || 0))} (Venta: ${formatoCOP(Number(c.precio_venta_real || 0))} - Costo: ${formatoCOP(Number(c.costo_real || 0))})`).join('\n');
                            reply = `${matchedModel} — ganancia por unidad:\n${lineas}\nGanancia total vendiendo todas: ${formatoCOP(ganTotal)}.`;
                        }
                    } else if (isMargin) {
                        const conCosto = listaBase.filter(c => Number(c.costo_real) > 0);
                        if (conCosto.length === 0) {
                            reply = `${matchedModel}: no tiene costo registrado para calcular el margen.`;
                        } else if (conCosto.length === 1) {
                            const c = conCosto[0];
                            const margen = (((Number(c.precio_venta_real) - Number(c.costo_real)) / Number(c.costo_real)) * 100).toFixed(1);
                            reply = `El margen de ${matchedModel} es ${margen}%.`;
                        } else {
                            const lineas = conCosto.map((c, i) => {
                                const margen = (((Number(c.precio_venta_real) - Number(c.costo_real)) / Number(c.costo_real)) * 100).toFixed(1);
                                return `• Unidad ${i + 1}: margen ${margen}% (Costo: ${formatoCOP(Number(c.costo_real))})`;
                            }).join('\n');
                            reply = `${matchedModel} — el margen varía según la unidad:\n${lineas}`;
                        }
                    } else if (isStock) {
                        reply = colorBuscado && capBuscada ? `Hay ${unidadesModelo.length} unidad(es) de ${matchedModel} de color ${colorBuscado} y ${capBuscada} en el inventario (${dispArr.length} disponibles).` : colorBuscado ? `Hay ${unidadesModelo.length} unidad(es) de ${matchedModel} de color ${colorBuscado} en el inventario (${dispArr.length} disponibles).` : capBuscada ? `Hay ${unidadesModelo.length} unidad(es) de ${matchedModel} de ${capBuscada} en el inventario (${dispArr.length} disponibles).` : `Hay ${unidadesModelo.length} unidad(es) de ${matchedModel} en el inventario (${dispArr.length} disponibles).`;
                    } else {
                        const lineas = listaBase.map((c, i) => `• Unidad ${i + 1}: recibido ${formatoCOP(Number(c.costo_real || 0))} → venta sugerida ${formatoCOP(Number(c.precio_venta_real || 0))}`).join('\n');
                        reply = `${matchedModel} (${unidadesModelo.length} unidad(es)):\n${lineas}`;
                    }
                } else if ((qNorm.includes('cuantos') || qNorm.includes('cuanto') || qNorm.includes('hay') || qNorm.includes('tienes') || qNorm.includes('precio') || qNorm.includes('vale')) && (qNorm.includes('iphone') || qNorm.includes('celular') || qNorm.includes('modelo'))) {
                    reply = "No encontré ese producto en el inventario.";
                } else if ((qNorm.includes('cuanto') || qNorm.includes('vale') || qNorm.includes('precio') || qNorm.includes('cuesta')) && !matchedModel && !matchedAccessory) {
                    reply = "¿Qué producto o modelo quieres consultar?";
                } else {
                    reply = "No tengo ese dato disponible en CeluControl.";
                }

                setTimeout(() => {
                    setMessages(prev => [
                        ...prev,
                        { sender: 'assistant', text: reply }
                    ]);
                }, 400);
            };

            return (
                <div className="relative">
                    {!isOpen && (
                        <button
                            onClick={() => setIsOpen(true)}
                            className="fixed bottom-6 right-6 z-50 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-5 rounded-full shadow-2xl flex items-center space-x-2 transition transform hover:scale-105"
                        >
                            <span>💬</span>
                            <span>Asistente CeluControl</span>
                        </button>
                    )}

                    {isOpen && (
                        <div className="fixed bottom-6 right-6 z-50 w-80 md:w-96 bg-white rounded-2xl shadow-2xl border flex flex-col h-[480px] overflow-hidden">
                            <div className="bg-indigo-600 text-white p-4 flex justify-between items-center">
                                <div className="flex items-center space-x-2">
                                    <span>💬</span>
                                    <h3 className="font-bold text-sm">Asistente CeluControl</h3>
                                </div>
                                <button
                                    onClick={() => setIsOpen(false)}
                                    className="text-white hover:text-gray-200 font-bold text-lg px-2"
                                >
                                    &times;
                                </button>
                            </div>

                            <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50 text-sm">
                                {messages.map((msg, index) => (
                                    <div
                                        key={index}
                                        className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}
                                    >
                                        <div
                                            className={`max-w-[80%] p-3 rounded-2xl text-xs md:text-sm ${
                                                msg.sender === 'user'
                                                    ? 'bg-indigo-600 text-white rounded-br-none'
                                                    : 'bg-white text-gray-800 border shadow-sm rounded-bl-none'
                                            }`}
                                        >
                                            {msg.text}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <form onSubmit={handleSend} className="p-3 bg-white border-t flex space-x-2">
                                <input
                                    type="text"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    placeholder="Escribe tu consulta..."
                                    className="flex-1 border rounded-xl px-3 py-2 text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                                <button
                                    type="submit"
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition"
                                >
                                    Enviar
                                </button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

                vender: (<><circle cx="9" cy="20" r="1.6" /><circle cx="17" cy="20" r="1.6" /><path d="M3 3h2l2.6 12.4a1.4 1.4 0 0 0 1.4 1.1h7.7a1.4 1.4 0 0 0 1.4-1.2L19.5 8H6.2" /></>),
                celulares: (<><rect x="7" y="2.5" width="10" height="19" rx="2.5" /><line x1="10.5" y1="18.5" x2="13.5" y2="18.5" /></>),
                accesorios: (<><path d="M9 3v7" /><path d="M15 3v7" /><path d="M6 10h12v2a6 6 0 0 1-6 6 6 6 0 0 1-6-6v-2z" /><line x1="12" y1="18" x2="12" y2="21" /></>),
                config: (<><line x1="4" y1="7" x2="20" y2="7" /><circle cx="9" cy="7" r="2.2" /><line x1="4" y1="17" x2="20" y2="17" /><circle cx="15" cy="17" r="2.2" /></>),
                usuarios: (<><circle cx="9" cy="8" r="3.4" /><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" /><circle cx="16.5" cy="9" r="2.6" /><path d="M17 14.4c2.3.5 3.9 2.2 3.9 4.6" /></>),
                logout: (<><path d="M9 3H5a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h4" /><path d="M16 17l5-5-5-5" /><line x1="21" y1="12" x2="9" y2="12" /></>),
                ventas: (<><path d="M6 2.5h12l1.6 16.2a1 1 0 0 1-1 1.2H5.4a1 1 0 0 1-1-1.2L6 2.5z" /><path d="M9 8.5V6.8a3 3 0 0 1 6 0v1.7" /></>),
                utilidad: (<><path d="M3 17l6-6 4 4 8-8" /><path d="M15 7h6v6" /></>),

                meta: (<><path d="M6.5 3h11l4 6.5L12 21 2.5 9.5 6.5 3z" /><path d="M2.5 9.5h19" /><path d="M12 21L8 9.5 12 3l4 6.5L12 21" /></>),
                rentabilidad: (<><path d="M3 3v18h18" /><path d="M7 14.5l4-5 3 3 5-7" /></>),
                retoma: (<><path d="M20.6 13.4 12 22l-8.6-8.6L3.2 10V3.2H10l.6.6z" /><circle cx="7.4" cy="7.4" r="1.5" /></>),
                sheet: (<><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="9" y1="9" x2="9" y2="21" /><line x1="15" y1="9" x2="15" y2="21" /></>)
            };
            return (

        // ==========================================
        // VISTA 1: RESUMEN Y DASHBOARD
        // ==========================================
        function PanelHistorialVentas({ ventas, accesorios, esAdmin, callGAS, onUpdate }) {
            const [editTarget, setEditTarget] = useState(null);
            const [editValor, setEditValor] = useState('');
            const [editCosto, setEditCosto] = useState('');
            const [editLoading, setEditLoading] = useState(false);
            const [editError, setEditError] = useState('');
            const [historialFull, setHistorialFull] = useState(null);
            const [histFullLoading, setHistFullLoading] = useState(false);

            const listaVentas = historialFull ? historialFull.ventas : ventas;
            const listaAccesorios = historialFull ? historialFull.accesorios : accesorios;
            const ventasOrdenadas = [...listaVentas].sort((a, b) => String(b.fecha_hora || '').localeCompare(String(a.fecha_hora || '')));

            const cargarHistorialCompleto = async () => {
                if (histFullLoading) return;
                if (historialFull) { setHistorialFull(null); return; }
                setHistFullLoading(true);
                try {
                    const data = await callGAS('getHistorialCompleto');
                    setHistorialFull(data);
                } catch (err) {
                    alert(err.message);
                } finally {
                    setHistFullLoading(false);
                }
            };

            const fmtFecha = (f) => {
                if (!f) return '—';
                try {
                    const d = new Date(f);
                    if (isNaN(d.getTime())) return String(f);
                    return d.toLocaleString('es-CO', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
                } catch (e) {
                    return '—';
                }
            };

            const nombreAcc = (id) => {
                if (!id) return '—';
                const a = listaAccesorios.find(x => String(x.id) === String(id));
                return a ? a.nombre : String(id);
            };

            const abrirEditar = (v) => {
                setEditTarget(v);
                setEditValor(Number(v.valor_venta || 0));
                setEditCosto(Number(v.costo_total || 0));
                setEditError('');
            };

            const guardarEdicion = async (e) => {
                e.preventDefault();
                setEditLoading(true);
                setEditError('');
                try {
                    await callGAS('editarVenta', {
                        ventaId: editTarget.id,
                        valor_venta: Number(editValor),
                        costo_total: Number(editCosto)
                    });
                    setEditTarget(null);
                    onUpdate();
                    alert('Venta corregida correctamente.');
                } catch (err) {
                    setEditError(err.message);
                } finally {
                    setEditLoading(false);
                }
            };

            const editGanancia = Number(editValor || 0) - Number(editCosto || 0);

            return (
                <>
                    <div className="ryuu-card ryuu-panel">
                        <div className="ryuu-panel__head">
                            <span className="ryuu-panel__title">
                                <RYUIcon name="ventas" className="ryuu-panel__ico" />
                                Historial de Ventas
                            </span>
                            <div className="flex items-center gap-2">

        function VistaResumen({ ventas, unidades, accesorios, esAdmin, callGAS, onUpdate }) {

                    return '—';

            const [perdAcId, setPerdAcId] = useState('');
            const [perdConcepto, setPerdConcepto] = useState('');

                setRegalosLoading(true);

                    const data = await callGAS('getRegalosDelMes');

                    console.error("Error cargando regalos del mes:", err);

                        detalle: perdDetalle.trim()

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                        {regalosLoading ? (
